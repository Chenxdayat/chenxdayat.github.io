<style>
.video-container {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: 9999 !important;
    background: #000000 !important;
    display: flex !important;
    align-items: flex-start !important;
    justify-content: center !important;
    overflow: hidden !important;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

#video {
    width: 100% !important;
    height: 100% !important;
}

.video-watermark {
    position: absolute !important;
    bottom: 50px !important;
    right: 5% !important;
    color: #ffffff !important; 
    font-family: Cambria, "Times New Roman", serif !important;
    font-size: 11px !important;
    font-weight: bold !important;
    text-shadow: 2px 2px 3px #000 !important;
    z-index: 1 !important;
    pointer-events: none !important; 
    user-select: none !important;
}

#loader {
    position: absolute;
    inset: 0;
    display: none; 
    align-items: center;
    justify-content: center;
    background-image: url(''); 
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    color: #fff;
    font-size: 18px;
    z-index: 4 !important;
}

#loader::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.4); 
    z-index: -1;
}

#notifBox {
  position: fixed;
  top: -120px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 15, 15, 0.95);
  color: #ffffff;
  padding: 10px 16px;
  border-radius: 10px;
  border: 1.5px solid #ffff00;
  font-family: Cambria, "Times New Roman", serif;
  font-size: 10px;
  font-weight: bold;
  z-index: 2147483647;
  
  display: flex;
  align-items: center; 
  gap: 14px;
  box-shadow: 0 6px 25px rgba(0, 0, 0, 0.8), 0 0 10px rgba(255, 255, 0, 0.1);
  transition: top 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: auto;
  min-width: 280px;
  max-width: 90%; 
  box-sizing: border-box;
}

#notifBox.show {
  top: 30px; 
}

#notifBox img {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid #ffff00;
  flex-shrink: 0;
}

.notifText {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  text-align: left;
  line-height: 1.3;
}

.notifText strong {
  color: #ffff00;
  font-weight: 700;
  font-size: 10px;
}

.notifText span {
  color: #e0e0e0;
  font-family: Cambria, "Times New Roman", serif;
  font-weight: bold;
}

#closeNotif {
  width: 16px;
  height: 16px;
  color: #ffff00;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.2s, color 0.2s;
  margin-left: 6px;
}

#closeNotif:hover {
  color: #adff2f;
  transform: scale(1.1);
}
</style>
