<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>JWPlayer HLS Player - CHENX-DAYAT</title>
  
  <!-- Referrer Protection (Penting untuk menyembunyikan asal domain blog) -->
  <script>
    var meta = document.createElement('meta');
    meta.name = 'referrer';
    meta.content = 'no-referrer';
    document.getElementsByTagName('head').appendChild(meta);
  </script>

  <style>
    /* Reset dasar browser agar penuh */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: black;
      overflow: hidden;
    }

    /* Video Container Fullscreen Luar */
    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Target utama container JWPlayer */
    #player {
      width: 100% !important;
      height: 100% !important;
    }

    /* Watermark teks CHENX-DAYAT di dalam player */
    .watermark-text {
      position: absolute;
      bottom: 1px;
      right: 5%;
      color: white;
      font-size: 10px;
      font-weight: bold;
      text-shadow: 2px 2px 3px #000
      z-index: 2147483647; /* Set ke nilai maksimal browser agar tidak tertutup */
      pointer-events: none;
      font-family: Cambria, "Times New Roman", serif;
    }
    
    /* Gambar background/loader bawaan player lama */
    .jwplayer, .jw-preview, .jw-aspect {
      background-image: url('https://bit.ly') !important;
      background-size: cover !important;
      background-position: center !important;
      background-repeat: no-repeat !important;
      background-color: transparent !important;
    }

    /* --- DESAIN NOTIFBOX ASLI ANDA (FIXED & AMAN) --- */
    #notifBox {
      position: fixed; /* Mengambang kokoh di atas semua lapisan video */
      top: -120px; /* Sembunyi jauh di atas layar luar sebelum muncul */
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: #ffffff;
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid #ffff00;
      font-family: Cambria, "Times New Roman", serif;
      font-size: 10px;
      z-index: 2147483647; /* Nilai z-index tertinggi agar di atas player HTML5 */
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      transition: top 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Efek animasi turun halus */
      pointer-events: auto;
      min-width: 240px;
    }

    /* Kelas pemicu saat notif box muncul */
    #notifBox.show {
      top: 30px; /* Jarak turun dari atas layar */
    }

    /* Gambar Profil Notif */
    #notifBox img {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #ffff00;
    }

    /* Teks di dalam Notif */
    .notifText {
      line-height: 1.4;
      font-weight: bold;
    }

    /* Tombol Close SVG */
    #closeNotif {
      width: 16px;
      height: 16px;
      color: #ffff00;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
      transition: color 0.2s;
    }
    #closeNotif:hover {
      color: #adff2f;
    }
  </style>

  <!-- Pustaka Core JWPlayer untuk HLS (.m3u8) -->
  <script src="https://cdn.jwplayer.com/libraries/SAHhwvZq.js"></script>
</head>
<body>

  <div class="video-container">
    <!-- ELEMEN NOTIFBOX ANDA (TETAP DI HTML UTAMA AGAR POSISI FIXED SEMPURNA) -->
    <div id="notifBox">
        <img src="https://bit.ly/4fCyTqu" alt="Notif">
        <div class="notifText">CHENX-DAYAT:<br>"Halo bos! Selamat menonton."</div>
        <div id="closeNotif">
            <svg xmlns="http://w3.org" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>
    </div>

    <div id="player"></div>
  </div>

  <script>
    function getQueryParam(name){
        return new URLSearchParams(window.location.search).get(name);
    }

    // URL default HLS beIN Sports milik Anda
    const defaultStream = "https://video.detik.com/trans7/smil:trans7.smil/chunklist_w1758539238_b744100_sleng.m3u8";

    // Cek apakah ada input dinamis dari URL ?src=... jika tidak ada pakai default beIN Sports
    const streamUrl = getQueryParam("src") || defaultStream;

    const player = jwplayer("player");

    player.setup({
      playlist: [{ 
        sources: [{
          file: streamUrl,
          type: "hls"
        }]
      }],
      skin: { name: "glow", active: "#ffff00", inactive: "#adff2f", background: "transparent" },
      width: "100%",
      height: "100%",
      aspectratio: "16:9",
      autostart: true,
      controls: true,
      mute: true,
      playsinline: true,
      preload: "auto",
      stretching: "uniform"
    });

    // FITUR 1: Injeksi Watermark Teks saat JWPlayer Siap
    player.on('ready', function() {
      const container = document.querySelector("#player .jw-wrapper");
      if (container) {
        const watermark = document.createElement("div");
        watermark.className = "watermark-text";
        watermark.innerText = "CHENX-DAYAT";
        container.appendChild(watermark);
      }
    });

    // FITUR 2: Kontrol Logika Jalannya Notif Box (Aman 100% Anti-Banned)
    const nBoxElement = document.getElementById("notifBox");
    const closeBtn = document.getElementById("closeNotif");
    let notifTimeout;

    function showNotif() {
      clearTimeout(notifTimeout);
      nBoxElement.classList.add("show");
      
      // Sembunyi otomatis dalam 8 detik jika tidak ditutup manual oleh penonton
      notifTimeout = setTimeout(function() {
        nBoxElement.classList.remove("show");
      }, 8000);
    }

    // Fungsi klik tombol silang tutup manual
    closeBtn.addEventListener("click", function(e) {
      e.stopPropagation(); // Mencegah klik video ikut terpicu
      clearTimeout(notifTimeout);
      nBoxElement.classList.remove("show");
    });

    // Mengaktifkan Pemanggilan Jeda Notif
    setTimeout(showNotif, 3000); // Meluncur turun setelah 3 detik halaman dimuat
    setInterval(showNotif, 1200000); // Muncul kembali otomatis setiap 20 menit sekali

    // FITUR 3: Pembatas Kualitas Maksimal 480p (Hemat Kuota)
    player.on("levels", function(e){
        let target = 0;
        let maxDiff = -Infinity;
        e.levels.forEach((level, index) => {
            if (level.height && level.height <= 480) {
                if (level.height > maxDiff) { maxDiff = level.height; target = index; }
            }
        });
        player.setCurrentQuality(target);
    });

    // FITUR 4: Auto Retry 3 Detik Jika Terjadi Error
    player.on("error", function(){
        setTimeout(function(){
            player.load([{ file: streamUrl, type: "hls" }]);
            player.play(true);
        }, 3000);
    });

    // FITUR 5: Unmute otomatis pada interaksi pertama penonton
    function handleFirstInteraction() { player.setMute(false); }
    document.addEventListener("click", handleFirstInteraction, {once:true});
    document.addEventListener("touchstart", handleFirstInteraction, {once:true});
  </script>

</body>
</html>
