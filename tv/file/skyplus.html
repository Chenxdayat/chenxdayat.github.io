<!--DOCTYPE html-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Live Player</title>

<script src="https://cdn.jwplayer.com/libraries/SAHhwvZq.js"></script>

<style>
/* KUNCI UTAMA: Trik Fullscreen Andalan Khas Bos */
.video-container {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: 9999 !important; /* Prioritas tampil mutlak menyelimuti iframe */
    background: #000000 !important;
    display: flex !important;
    align-items: flex-start !important;
    justify-content: center !important;
    overflow: hidden !important;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#jwplayerDiv{
    width:100% !important;
    height:100% !important;
}

/* GAYA WATERMARK TETAP AMAN DI FULLSCREEN */
.video-watermark {
    position: absolute !important;
    bottom: 1px !important; /* DIUBAH: Naikkan sedikit agar aman di atas bar control jw-wrapper bawaan */
    right: 5% !important;
    color: #ffffff !important; /* Warna putih */
    font-family: Cambria,"Times New Roman",serif !important;
    font-size: 11px !important;
    font-weight: bold !important;
    text-shadow: 2px 2px 3px #000 !important;
    z-index: 99999 !important; /* DINAIKKAN: Menyesuaikan layer video container */
    pointer-events: none !important; /* Klik tembus ke video */
    user-select: none !important;
}

/* DIKEMBALIKAN KE DISPLAY NONE AGAR TIDAK MENGUNCI VIDEO */
#loader{
    position:absolute;
    inset:0;
    display:none; 
    align-items:center;
    justify-content:center;
    
    /* URL Gambar Background Loading */
    background-image: url(''); 
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    
    color:#fff;
    font-size:18px;
    z-index:999999; /* DINAIKKAN: Supaya menutupi seluruh elemen saat buffer */
}

#loader::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.4); /* Gelap tipis 40% */
    z-index: -1;
}

#notifBox{
    position: absolute; /* DIUBAH: Menggunakan absolute agar terkunci di dalam player saat fullscreen */
    left: 15px;
    bottom: 60px; /* DIUBAH: Disesuaikan posisinya agar proporsional */
    width: 240px;

    display: flex;
    align-items: center;
    gap: 10px;

    padding: 12px;
    border-radius: 14px;

    color: #fff;
    background: rgba(30,30,30,.75);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    box-shadow: 0 10px 25px rgba(0,0,0,.35);

    cursor: pointer;
    z-index: 99999; /* DINAIKKAN: Muncul aman di atas player */

    opacity: 0;
    transform: translateY(25px);
    transition: .35s;
    
    pointer-events: none; /* DITAMBAHKAN: Membuat klik tembus ke player saat notif sedang sembunyi */
}

#notifBox.show{
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto; /* DITAMBAHKAN: Mengaktifkan fungsi klik kembali hanya saat notif sedang muncul */
}

#notifBox img{
    width:35px;
    height:35px;
    flex-shrink:0;
}

.notifText{
    font-size:10px;
    font-family: Cambria,"Times New Roman",serif;
    font-weight: bold;
    line-height:1.4;
}

#closeNotif{
    position:absolute;
    top:6px;
    right:8px;
    font-size:12px;
    opacity:.7;
    cursor:pointer;
}

#closeNotif:hover{
    opacity:1;
}
</style>
</head>

<body>

<!-- PEMBUNGKUS TRIK FULLSCREEN ANDALAN BOS -->
<div class="video-container">

    <div id="jwplayerDiv"></div>

    <!-- ELEMEN WATERMARK -->
    <div class="video-watermark" id="myWatermark">CHENX-DAYAT</div>

    <div id="loader">
        Connecting...
    </div>

    <!-- ELEMEN NOTIFBOX -->
    <div id="notifBox">
        <img src="https://bit.ly/4fCyTqu" alt="Notif">
        <div class="notifText">CHENX-DAYAT:<br>"Halo bos! Selamat menonton."</div>
        <div id="closeNotif">✕</div>
    </div>

</div>
