<!--DOCTYPE html-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Live Player</title>

<script src="https://cdn.jwplayer.com/libraries/SAHhwvZq.js"></script>

<style>
  /* KUNCI UTAMA: Trik Fullscreen Andalan Khas Bos */
.video-container {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: 9999 !important; /* Prioritas tampil mutlak menyelimuti iframe */
    background: #000000 !important;
    display: flex !important;
    align-items: flex-start !important;
    justify-content: center !important;
    overflow: hidden !important;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#jwplayerDiv{
    width:100% !important;
    height:100% !important;
}

/* GAYA WATERMARK TETAP AMAN DI FULLSCREEN */
.video-watermark {
    position: absolute !important;
    bottom: 2px !important; /* Pas di atas control bar jwplayer */
    right: 5% !important;
    color: #ffffff !important; 
    font-family: Cambria,"Times New Roman",serif !important;
    font-size: 11px !important;
    font-weight: bold !important;
    text-shadow: 2px 2px 3px #000 !important;
    z-index: 99999 !important; 
    pointer-events: none !important; 
    user-select: none !important;
}

#loader{
    position:absolute;
    inset:0;
    display:none; 
    align-items:center;
    justify-content:center;
    
    /* URL Gambar Background Loading */
    background-image: url(''); 
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    
    color:#fff;
    font-size:18px;
    z-index:999999; /* Supaya menutupi seluruh elemen saat buffer */
}

#loader::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.4); 
    z-index: -1;
}

/* --- PERBAIKAN DESAIN NOTIFBOX CHENX-DAYAT PILIHAN BOS (TOP SLIDE & CAMBRIA FONT) --- */
#notifBox {
  position: fixed; /* Menggunakan fixed agar meluncur stabil di atas video layar penuh */
  top: -120px; /* Posisi awal bersembunyi di atas luar layar */
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 15, 15, 0.95); /* Warna latar gelap pekat */
  color: #ffffff;
  padding: 10px 16px;
  border-radius: 10px;
  
  /* PENGATURAN BORDER: Kuning menyala dan tipis rapi */
  border: 1.5px solid #ffff00; 
  
  font-family: Cambria, "Times New Roman", serif;
  font-size: 10px;
  font-weight: bold;
  z-index: 2147483647; /* Prioritas di atas seluruh lapisan video HTML5 */
  
  /* Mengatur tata letak sejajar horizontal */
  display: flex;
  align-items: center; 
  gap: 14px;
  box-shadow: 0 6px 25px rgba(0, 0, 0, 0.8), 0 0 10px rgba(255, 255, 0, 0.1);
  transition: top 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Efek memantul lembut */
  pointer-events: auto;
  min-width: 280px;
  max-width: 90%; /* Aman untuk layar HP agar tidak meluber */
  box-sizing: border-box;
}

/* Kelas pemicu saat notif box meluncur turun */
#notifBox.show {
  top: 30px; /* Muncul di area atas tengah video */
}

/* Gambar Profil Bulat Sempurna */
#notifBox img {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid #ffff00;
  flex-shrink: 0; /* Mencegah gambar gepeng */
}

/* PERBAIKAN TEKS: Penyelarasan paragraf dan jarak baris */
.notifText {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px; /* Jarak antara nama dan ucapan */
  text-align: left;
  line-height: 1.3;
}

/* Gaya khusus untuk teks Nama */
.notifText strong {
  color: #ffff00; /* Nama berwarna kuning agar menonjol */
  font-weight: 700;
  font-size: 10px;
}

/* Gaya khusus untuk teks Pesan */
.notifText span {
  color: #e0e0e0;
  font-family: Cambria, "Times New Roman", serif;
  font-weight: bold;
}

/* Tombol Silang SVG Presisi */
#closeNotif {
  width: 16px;
  height: 16px;
  color: #ffff00;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.2s, color 0.2s;
  margin-left: 6px;
}

#closeNotif:hover {
  color: #adff2f;
  transform: scale(1.1); /* Efek membesar sedikit saat disentuh */
}
  </style>
</head>

<body>

<!-- PEMBUNGKUS TRIK FULLSCREEN ANDALAN BOS -->
<div class="video-container">

    <div id="jwplayerDiv"></div>

    <!-- ELEMEN WATERMARK -->
    <div class="video-watermark" id="myWatermark">CHENX-DAYAT</div>

    <div id="loader">
        Connecting...
    </div>

    <!-- ELEMEN NOTIFBOX DENGAN STYLE KREASI BOS (CLOSE SVG + BORDER) -->
    <div id="notifBox">
        <img src="https://bit.ly/4fCyTqu" alt="Notif">
        <div class="notifText">
            <strong>CHENX-DAYAT:</strong>
            <span>"Halo bos! Selamat menonton."</span>
        </div>
        <div id="closeNotif">
            <svg xmlns="http://w3.org" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>
    </div>

</div>
  
<script>
function getQueryParam(name){
    return new URLSearchParams(window.location.search).get(name);
}

const streamUrl =
    getQueryParam("src") ||
    "https://video.detik.com/trans7/smil:trans7.smil/chunklist_w1758539238_b744100_sleng.m3u8";

const player = jwplayer("jwplayerDiv");

player.setup({
    file: streamUrl,
    width: "100%",
    height: "100%",
    aspectratio: "16:9",
    autostart: true,
    mute: true,
    playsinline: true,
    preload: "auto",
    type: "hls",
    hlshtml: true,
    stretching: "uniform",
    playbackRateControls: false,
    cast: {
        appid: "CC1AD845"
    }
});

/* Paksa tampilkan gambar loader begitu player di-setup */
document.getElementById("loader").style.display = "flex";

/* PERBAIKAN: STRUKTUR INJEKSI DOM (Menggunakan appendChild ke jw-wrapper) */
player.on("ready", function() {
    const watermark = document.getElementById("myWatermark");
    const notifBox = document.getElementById("notifBox");
    const jwWrapper = document.querySelector(".jw-wrapper");
    
    if (jwWrapper) {
        if (watermark) jwWrapper.appendChild(watermark);
        if (notifBox) jwWrapper.appendChild(notifBox);
    }
    
    /* PENGAMAN EKSTRA: Jika video langsung siap tanpa buffer, tutup gambarnya */
    setTimeout(function(){
        if(player.getState() === "playing" || player.getState() === "paused"){
            document.getElementById("loader").style.display = "none";
        }
    }, 1500);
});

/* PERBAIKAN: LOGIKA PEMILIHAN KUALITAS AWAL (Maksimal 480p paling mendekati) */
player.on("levels", function(e){
    let target = 0;
    let maxDiff = -Infinity;
    
    e.levels.forEach((level, index) => {
        if (level.height && level.height <= 480) {
            if (level.height > maxDiff) {
                maxDiff = level.height;
                target = index;
            }
        }
    });
    player.setCurrentQuality(target);
});

/* Loader kontrol */
player.on("buffer", function(){
    document.getElementById("loader").style.display = "flex";
});

player.on("play", function(){
    document.getElementById("loader").style.display = "none";
});

player.on("firstFrame", function(){
    document.getElementById("loader").style.display = "none";
});

/* PERBAIKAN: Unmute & Auto Fullscreen Android yang Valid (Sesuai Aturan User Gesture) */
function handleFirstInteraction() {
    player.setMute(false);
    
    // Trik Auto Fullscreen dipindah ke sini agar disetujui browser Android
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    if(!isIOS && window.innerWidth < 768){
        try{
            player.setFullscreen(true);
        }catch(err){}
    }
}

document.addEventListener("click", handleFirstInteraction, {once:true});
document.addEventListener("touchstart", handleFirstInteraction, {once:true});

/* Auto retry */
player.on("error", function(){
    document.getElementById("loader").style.display = "flex";
    setTimeout(function(){
        player.load([{ file: streamUrl, type: "hls" }]);
        player.play(true);
    },3000);
});

/* PERBAIKAN: KONTROL NOTIFIKASI BEBAS GLITCH */
const notifBox = document.getElementById("notifBox");
let notifTimeout;

function showNotif(){
    clearTimeout(notifTimeout); // Bersihkan sisa waktu timeout sebelumnya jika ada tabrakan
    
    notifBox.classList.add("show");
    notifTimeout = setTimeout(function(){
        notifBox.classList.remove("show");
    }, 8000); // Notif hilang dalam 8 detik
}

document.getElementById("closeNotif").addEventListener("click", function(e){
    e.stopPropagation();
    clearTimeout(notifTimeout);
    notifBox.classList.remove("show");
});

// WAKTU PEMANGGILAN NOTIF
setTimeout(showNotif, 3000);
setInterval(showNotif, 1200000);
</script>

</body>
</html>
